<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SurrealGuard Playground</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f1115;
        --panel: #171a21;
        --border: #2a2f3a;
        --text: #e6e8ee;
        --muted: #8b93a7;
        --error: #ff6b6b;
        --warning: #ffcc66;
        --hint: #66b3ff;
        --accent: #a78bfa;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 24px;
      }
      h1 { font-size: 18px; margin: 0 0 4px; }
      p.sub { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        max-width: 1100px;
      }
      @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
      label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
      textarea {
        width: 100%;
        min-height: 140px;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        font: inherit;
        font-size: 13px;
        resize: vertical;
      }
      textarea:focus { outline: none; border-color: var(--accent); }
      .results {
        max-width: 1100px;
        margin-top: 16px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        min-height: 60px;
        font-size: 13px;
      }
      .status { color: var(--muted); font-size: 12px; }
      .diag {
        display: flex;
        gap: 10px;
        align-items: baseline;
        padding: 6px 0;
        border-bottom: 1px solid var(--border);
      }
      .diag:last-child { border-bottom: none; }
      .code { font-weight: 700; }
      .code.error { color: var(--error); }
      .code.warning { color: var(--warning); }
      .code.hint { color: var(--hint); }
      .span { color: var(--muted); font-size: 11px; white-space: nowrap; }
      .ok { color: #58d68d; }
    </style>
  </head>
  <body>
    <h1>SurrealGuard Playground</h1>
    <p class="sub">
      The analyzer compiled to WebAssembly (wasm32-wasip1), running entirely
      in your browser. Edit the schema or query for live diagnostics.
    </p>

    <div class="grid">
      <div>
        <label for="schema">Schema (.surql)</label>
        <textarea id="schema" spellcheck="false">DEFINE TABLE user SCHEMAFULL;
DEFINE FIELD name ON user TYPE string;
DEFINE FIELD email ON user TYPE string;</textarea>
      </div>
      <div>
        <label for="query">Query (.surql)</label>
        <textarea id="query" spellcheck="false">SELECT ssn FROM user;</textarea>
      </div>
    </div>

    <div class="results" id="results">
      <span class="status">Loading analyzer…</span>
    </div>

    <script type="module">
      import { createAnalyzer } from "./sg-analyzer.mjs";

      const results = document.getElementById("results");
      const schemaEl = document.getElementById("schema");
      const queryEl = document.getElementById("query");

      let analyzer;

      function render(diagnostics) {
        if (!diagnostics.length) {
          results.innerHTML =
            '<span class="ok">No diagnostics — the query type-checks.</span>';
          return;
        }
        results.innerHTML = diagnostics
          .map(
            (d) => `
            <div class="diag">
              <span class="code ${d.severity}">${d.code}</span>
              <span>${escapeHtml(d.message)}</span>
              <span class="span">[${d.start}..${d.end}]</span>
            </div>`
          )
          .join("");
      }

      function escapeHtml(s) {
        return s.replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c]
        );
      }

      function run() {
        if (!analyzer) return;
        try {
          render(analyzer.analyze(schemaEl.value, queryEl.value));
        } catch (err) {
          results.innerHTML = `<span class="code error">wasm error</span> ${escapeHtml(
            String(err)
          )}`;
        }
      }

      (async () => {
        try {
          const bytes = await fetch("./surrealguard_wasm.wasm").then((r) =>
            r.arrayBuffer()
          );
          analyzer = await createAnalyzer(bytes);
          schemaEl.addEventListener("input", run);
          queryEl.addEventListener("input", run);
          run();
        } catch (err) {
          results.innerHTML = `<span class="code error">failed to load</span> ${escapeHtml(
            String(err)
          )}`;
        }
      })();
    </script>
  </body>
</html>
