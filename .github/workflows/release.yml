name: Release

on:
  push:
    tags:
      - "v*"

# The release job uploads archives to the GitHub Release for the tag.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

# ASSET NAMING SCHEME (must stay identical to the npm launcher
# npm/surrealql-analyzer/bin/surrealql-analyzer.cjs, crates/cli Cargo.toml
# [package.metadata.binstall], and the Zed extension's downloader in
# DrewRidley/zed-surreal src/lib.rs):
#
#   tag:     v{version}
#   archives (both, per target):
#     CLI:  surrealql-analyzer-{version}-{target}.tar.gz      (unix)
#           surrealql-analyzer-{version}-{target}.zip          (windows)
#     LSP:  surrealql-analyzer-lsp-{version}-{target}.tar.gz   (unix)
#           surrealql-analyzer-lsp-{version}-{target}.zip       (windows)
#   binary at archive root: surrealql-analyzer | surrealql-analyzer.exe
#                           surrealql-analyzer-lsp | surrealql-analyzer-lsp.exe

jobs:
  build:
    name: build · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            # aarch64 Linux is cross-compiled natively with the gnu cross
            # toolchain (not `cross`): the vendored tree-sitter grammar compiles
            # C via the `cc` crate, and a native cross build points `cc` at the
            # cross compiler directly (see the toolchain step below).
            gcc-cross: aarch64-linux-gnu
          # Cross-compiled from Apple Silicon. `macos-13` was the last Intel
          # runner and has been retired, so a job asking for it queues forever
          # rather than failing — v0.4.1 sat waiting on this one job for 23
          # hours while its other four targets had long since succeeded, and
          # the release it was meant to publish never appeared. The Apple
          # toolchain targets both architectures, and `rust-toolchain` above
          # already installs `matrix.target`, so nothing else has to change.
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      # The SurrealQL grammar is vendored in-repo at
      # `crates/tree-sitter-surrealql`, so a single checkout is all we need.
      - name: Check out surrealql-analyzer
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install gnu cross toolchain
        if: matrix.gcc-cross != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-${{ matrix.gcc-cross }}
          # Point cargo's linker and the `cc` crate (grammar build script) at
          # the cross compiler for the target.
          triple_env=$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')
          echo "CARGO_TARGET_${triple_env}_LINKER=${{ matrix.gcc-cross }}-gcc" >> "$GITHUB_ENV"
          echo "CC_${{ matrix.target }}=${{ matrix.gcc-cross }}-gcc" >> "$GITHUB_ENV"
          echo "CXX_${{ matrix.target }}=${{ matrix.gcc-cross }}-g++" >> "$GITHUB_ENV"

      - name: Build CLI + LSP
        run: cargo build --release -p surrealql-analyzer -p surrealql-analyzer-lsp --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          version="${GITHUB_REF_NAME#v}"
          bindir="target/${{ matrix.target }}/release"
          cli="surrealql-analyzer-${version}-${{ matrix.target }}.tar.gz"
          lsp="surrealql-analyzer-lsp-${version}-${{ matrix.target }}.tar.gz"
          tar -czf "$cli" -C "$bindir" surrealql-analyzer
          tar -czf "$lsp" -C "$bindir" surrealql-analyzer-lsp
          {
            echo "ASSET_CLI=${cli}"
            echo "ASSET_LSP=${lsp}"
          } >> "$GITHUB_ENV"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $bindir = "target/${{ matrix.target }}/release"
          $cli = "surrealql-analyzer-$version-${{ matrix.target }}.zip"
          $lsp = "surrealql-analyzer-lsp-$version-${{ matrix.target }}.zip"
          Compress-Archive -Path "$bindir/surrealql-analyzer.exe" -DestinationPath $cli -Force
          Compress-Archive -Path "$bindir/surrealql-analyzer-lsp.exe" -DestinationPath $lsp -Force
          "ASSET_CLI=$cli" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ASSET_LSP=$lsp" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET_CLI }}
            ${{ env.ASSET_LSP }}
          fail_on_unmatched_files: true
