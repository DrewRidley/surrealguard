name: CI

on:
  push:
    branches: [main, master, redesign-v3-foundation]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: build · test · lint
    runs-on: ubuntu-latest
    steps:
      # The SurrealQL grammar is vendored in-repo at
      # `crates/tree-sitter-surrealql`, so a single checkout is all CI needs.
      - name: Check out surrealql-analyzer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

  packages:
    name: js packages · build · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run build
      - run: pnpm -r run typecheck
      - run: pnpm -r --if-present run test

      # The published diagnostics page is generated from
      # crates/diagnostics/src/catalog.rs. Fail the build if a code was added
      # or its severity changed without regenerating — that drift is how the
      # page fell 88 codes behind the catalog once already.
      - name: Diagnostics page is in sync with the catalog
        run: pnpm run docs:diagnostics:check
