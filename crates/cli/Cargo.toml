[package]
name = "surrealql-analyzer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "Static analyzer and type-inference engine for SurrealQL — the surrealql-analyzer CLI"

# cargo-binstall: fetch the prebuilt binary from the GitHub Release instead of
# building from source. The asset naming scheme MUST stay identical to the npm
# launcher (npm/surrealql-analyzer/bin/surrealql-analyzer.cjs) and the release workflow
# (.github/workflows/release.yml):
#
#   tag:     v{version}
#   archive: surrealql-analyzer-{version}-{target}.tar.gz   (unix)
#            surrealql-analyzer-{version}-{target}.zip       (windows)
#   binary:  surrealql-analyzer | surrealql-analyzer.exe           (at archive root)
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.{ archive-format }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
surrealql-analyzer-codegen = { path = "../codegen", version = "0.5.3" }
surrealql-analyzer-diagnostics = { path = "../diagnostics", version = "0.5.3" }
surrealql-analyzer-embed = { path = "../embed", version = "0.5.3" }
surrealql-analyzer-syntax = { path = "../syntax", version = "0.5.3" }
surrealql-analyzer-workspace = { path = "../workspace", version = "0.5.3" }
clap = { version = "4", features = ["derive"]}
# `--watch`. `notify-debouncer-full` is the `notify` project's own debouncer:
# it merges the event storm one save produces and tracks renames by file id, so
# the CLI does not hand-roll either. It re-exports `notify`, which keeps the two
# on one version. Default features only (no crossbeam/flume/serde) — this pulls
# in `notify`, `notify-types` and `file-id`, and nothing else new.
notify-debouncer-full = "0.7.0"
walkdir = "2.5.0"
glob = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
