[package]
name = "surrealguard-typegen"
version.workspace = true
edition.workspace = true
publish = false
description = "TypeScript code generator for SurrealQL — generates typed interfaces and query functions from .surql files"

[[bin]]
name = "surrealguard-typegen"
path = "src/main.rs"

[dependencies]
surrealguard-analyzer = { path = "../analyzer" }
tree-sitter.workspace = true
walkdir = "2"
