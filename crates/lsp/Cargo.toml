[package]
name = "surrealguard-lsp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "Language Server Protocol implementation for SurrealQL powered by SurrealGuard"

[[bin]]
name = "surrealguard-lsp"
path = "src/main.rs"

[dependencies]
surrealguard-diagnostics = { path = "../diagnostics", version = "0.5.3" }
surrealguard-embed = { path = "../embed", version = "0.5.3" }
surrealguard-syntax = { path = "../syntax", version = "0.5.3" }
surrealguard-workspace = { path = "../workspace", version = "0.5.3" }
tower-lsp = "0.20"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "sync"] }
walkdir = "2"

[dev-dependencies]
futures = "0.3"
serde_json = "1"
tower = { version = "0.4", features = ["util"] }

[lints]
workspace = true
