[workspace]
members = [
    "crates/cli",
    "crates/codegen",
    "crates/diagnostics",
    "crates/embed",
    "crates/lsp",
    "crates/macros",
    "crates/rs",
    "crates/syntax",
    "crates/tree-sitter-surrealql",
    "crates/wasm",
    "crates/workspace",
]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
authors = ["Drew Ridley"]
readme = "README.md"
repository = "https://github.com/DrewRidley/surrealguard"
homepage = "https://github.com/DrewRidley/surrealguard"
description = "Static analysis for SurrealQL embedded across host languages"
license = "MIT OR Apache-2.0"
keywords = ["surrealql", "surrealdb", "static-analysis", "type-inference", "lsp"]
categories = ["development-tools", "parsing"]

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
doc_markdown = "warn"
too_many_lines = "warn"
map_unwrap_or = "warn"
redundant_closure_for_method_calls = "warn"
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
explicit_iter_loop = "warn"
unnested_or_patterns = "warn"

[workspace.dependencies]
tree-sitter = "0.26"
# The SurrealQL grammar is vendored in-repo at `crates/tree-sitter-surrealql`
# (package `surrealguard-tree-sitter-surrealql`, published under that name
# because `tree-sitter-surrealql` is taken on crates.io). The `package` rename
# keeps `tree-sitter-surrealql.workspace = true` importable as
# `tree_sitter_surrealql`. The `version` lets dependent crates publish.
tree-sitter-surrealql = { path = "crates/tree-sitter-surrealql", version = "0.4.0", package = "surrealguard-tree-sitter-surrealql" }
surrealdb-types = "3.1.3"
