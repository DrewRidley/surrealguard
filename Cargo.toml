[workspace]
members = [
    "crates/cli",
    "crates/diagnostics",
    "crates/lsp",
    "crates/syntax",
    "crates/types",
    "crates/workspace",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Drew Ridley"]
readme = "README.md"
repository = "https://github.com/DrewRidley/surrealguard.git"
description = "Static analysis for SurrealQL embedded across host languages"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tree-sitter = "0.26"
tree-sitter-surrealql = { path = "../tree-sitter-surrealql" }
