[workspace]
members = [
    "crates/cli",
    "crates/codegen",
    "crates/diagnostics",
    "crates/embed",
    "crates/lsp",
    "crates/macros",
    "crates/rs",
    "crates/syntax",
    "crates/wasm",
    "crates/workspace",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Drew Ridley"]
readme = "README.md"
repository = "https://github.com/DrewRidley/surrealguard"
homepage = "https://github.com/DrewRidley/surrealguard"
description = "Static analysis for SurrealQL embedded across host languages"
license = "MIT OR Apache-2.0"
keywords = ["surrealql", "surrealdb", "static-analysis", "type-inference", "lsp"]
categories = ["development-tools", "parsing"]

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
doc_markdown = "warn"
too_many_lines = "warn"
map_unwrap_or = "warn"
redundant_closure_for_method_calls = "warn"
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
explicit_iter_loop = "warn"
unnested_or_patterns = "warn"

[workspace.dependencies]
tree-sitter = "0.26"
# Path dependency on the (soon-to-be-upstreamed) grammar fork. This MUST carry a
# crates.io `version` before any workspace crate can be published — see the
# release checklist. Local builds resolve via `path`; a published build resolves
# via `version`.
tree-sitter-surrealql = { path = "../tree-sitter-surrealql" }
surrealdb-types = "3.1.3"
